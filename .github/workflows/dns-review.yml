name: DNS Zone Reviewer

on:
  pull_request:
    paths:
      # Trigger ONLY when a PR touches any file inside zones/*.txt
      - 'zones/*.txt'

jobs:
  review:
    # Runs on ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      # Checks out the repo with full git history (fetch-depth: 0)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      # Sets up Python 3.11
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Optional but good practice for production

      # Installs dependencies from requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Runs src/main.py
      - name: Run DNS Reviewer
        run: python src/main.py
